# The registry: everything the hub runs for this household, and every setting it
# reads. Nothing runs because it is on disk. It runs because it is on this list.
# Edit it with any editor. The hub notices on its own tick.

[hub]
tick_seconds = 5
store_url = "postgres://127.0.0.1:5432/hub"
state_dir = "/var/lib/imprnt-hub"
# Each store role's password, written by `imprnt install` and readable by the
# account the hub runs as and by no agent's box. `secrets` under state_dir when
# this line is absent.
secrets_dir = "/var/lib/imprnt-hub/secrets"
tail_hours = 24
tail_tokens = 8000
claim_lease_seconds = 300
restart_delay_seconds = 1
give_up_after = 5
give_up_window_seconds = 300
job_grace_seconds = 300
silent_runner_hours = 6
# How long a runner waits before it tries a credential that refused a turn
# again. A refused login or a used-up plan window holds every row and the
# runners retry on their own on this interval, so nothing is handed to a person
# as could not answer.
outage_retry_seconds = 300
# The command the runner spawns to file a harvested note. `imprnt` on its own
# PATH by default; a household whose vault CLI is somewhere else names it here.
imprnt = "imprnt"

# Which recognizer this household transcribes voice notes with, by the name of
# one of the [recognizers.*] tables below. Delete this line and the component is
# not installed: a voice note is saved and logged as it always was, the agent is
# told it is not transcribed, and nothing under here is read at all.
# The three knobs are the door's own step: how long a note waits before the
# recognizer is tried again, how long it waits for its text in total before the
# door says it could not, and how long one piece of it may take.
[voice]
recognizer = "local"
retry_seconds = 300
give_up_hours = 24
chunk_deadline_seconds = 120

# Where the store's own process is, so the hub can measure it without guessing
# at a process tree. Every standard install writes a pid file: this is Debian's,
# and `imprnt install` writes the right one for the box it is run on, once.
[store]
pid_file = "/var/run/postgresql/15-main.pid"
unit = "postgresql@15-main.service"

# The household's shared zone, declared once. `mount` is the folder name every
# vault carries it under, `remote` is the git remote name every checkout wears,
# and `url` is what a clone of it reads. Sharing a note means moving it into that
# folder, and it reaches the other person after both syncs run.
[zone]
mount = "shared-notes"
remote = "origin"
url = "git@example.invalid:household/shared-notes.git"

# The machines this household has. `os` is in the file rather than taken from the
# process, so a mis-set machine id is refused here instead of writing systemd
# unit files onto a Mac. Below two machines, no [[run]] entry needs a `machine`.
[[machines]]
id = "pi"
os = "linux"

# A machine that is not the hub's keeps its state and its role passwords on its
# own disk and reaches the one store over the tailnet, so its entry may carry
# its own state_dir, secrets_dir (`secrets` under its state_dir when absent)
# and store_url. A process on that machine reads them in place of the [hub]
# table's. THE ADDRESS BELOW IS AN EXAMPLE: it is the hub machine's tailnet
# address, and the url carries no user and no password, because a process
# supplies its own role and reads that role's password file from secrets_dir.
[[machines]]
id = "mac"
os = "macos"
state_dir = "/Users/owner/.imprnt-hub"
store_url = "postgres://100.64.0.1:5432/hub"

# A person, and the tree that is the boundary. Each agent's box reaches its own
# person's tree and nothing else. The shared zone is a checkout inside that
# tree, so it is reached by the same grant.
# The four clocks are this person's own and the language is the one the door
# writes its own lines in. All five are optional: a person who sets none is
# measured against 30, 60, 900 and 60 seconds and reads English.
# The harvest is this person's own too. `harvester` names the preset one slice
# of their chats is read under, and its absence means these chats are not
# harvested at all and `check` says so. `vault` names the directory holding
# vault/ and raw/, and it lies inside this person's tree, because the box the
# harvester's session runs in fences that tree. The quiet timeout, the minimum
# slice and the line back are all defaulted: 30 minutes, one message on a plan
# harvester and twenty on a per-token key, and a line back.
[[people]]
id = "p1"
allowed_senders = { "door-telegram" = [] }
tree = "/var/lib/imprnt-hub/p1"
language = "en"
acked_seconds = 30
started_seconds = 60
answered_seconds = 900
delivered_seconds = 60
harvester = "harvest"
vault = "/var/lib/imprnt-hub/p1/vault-project"
harvest_quiet_minutes = 30
harvest_min_messages = 1
harvest_report = true
# Where this person's tree and vault are on a machine that is not the hub's,
# keyed by machine id. An agent whose runner is on that machine is boxed in the
# tree there and files into the vault there. A placement names a tree, and it
# names a vault whenever the entry does. A person who says nothing about a
# machine keeps the paths above on it.
on = { mac = { tree = "/Users/owner/vault-project", vault = "/Users/owner/vault-project" } }

[[people]]
id = "p2"
tree = "/var/lib/imprnt-hub/p2"
language = "ru"
acked_seconds = 30
started_seconds = 60
answered_seconds = 900
delivered_seconds = 60
harvester = "harvest"
vault = "/var/lib/imprnt-hub/p2/vault-project"
harvest_quiet_minutes = 30
harvest_min_messages = 1
harvest_report = false

# A credential has one owner and one place, and every agent that uses it points
# at that file. `check` opens every one of them and asks whether it still works.
[[credentials]]
id = "household-claude"
kind = "claude-login"
file = "/var/lib/imprnt-hub/credentials/.credentials.json"
owner = "household"
# Where the same login is on a machine that is not the hub's. On a Mac, Claude
# Code keeps its login in the keychain item named here, so `check` opens that
# item, the copy scan takes its tokens from it, and a launch copies it into
# `file` (mode 600, remade for every session) because the boxed loop reads a
# file and never the keychain. `keychain` is allowed on a macOS machine only.
on = { mac = { file = "/Users/owner/.imprnt-hub/login/.credentials.json", keychain = "Claude Code-credentials" } }

[[credentials]]
id = "telegram-bot"
kind = "telegram"
file = "/etc/imprnt-hub/telegram.token"
owner = "household"

# A preset is a bundle of settings. Its id is derived from these five, so a
# changed setting is a different preset and an id is never typed here.
# The window thresholds are settings here and never numbers in code: at
# window_pause_at percent proactive work pauses, at window_notice_at one line
# goes into each person's chat, and at window_hold_at every row waits for the
# reset. An agent on a per-token key has no window and carries none of the three.
[presets.daily]
adapter = "claude-code"
model = "a-model-name"
provider = "anthropic"
effort = "medium"
paid = "plan"
credential = "household-claude"
window_pause_at = 85
window_notice_at = 95
window_hold_at = 100

# The harvester runs a stronger model than the chat does, which is the whole
# point of it being its own preset: it reads one slice of a chat once a quiet
# period and the judgment it makes is kept for ever.
[presets.harvest]
adapter = "claude-code"
model = "a-stronger-model-name"
provider = "anthropic"
effort = "high"
paid = "plan"
credential = "household-claude"
window_pause_at = 85
window_notice_at = 95
window_hold_at = 100

# The recognizers this household declares, one table each, and `voice.recognizer`
# above names the one it uses. A `sherpa-onnx` one runs beside the door on
# loopback, so it names the directory holding its own files and dials nobody. A
# `deepgram` one is dialled, so it names a [[credentials]] entry of kind
# `api-key` instead and has no directory. `chunk_seconds` is how much audio goes
# in one request, and 0 means the whole note goes in one.
[recognizers.local]
provider = "sherpa-onnx"
model = "a-speech-model-directory"
runtime = "/var/lib/imprnt-hub/voice"
chunk_seconds = 60

# An agent is a person, a preset, a chat, and the pieces that serve it.
[[agents]]
id = "p1-lair"
person = "p1"
preset = "daily"
chat = "0000000000"
door = "door-telegram"
runner = "runner-pi"

# What a model cost per million tokens, from the day the price started. A turn is
# priced from the newest row already in force when it ran, and from no other.
[[rates]]
model = "a-model-name"
from = "2026-01-01"
input_per_m = 1.0
cached_per_m = 0.1
output_per_m = 5.0
currency = "USD"

[[run]]
id = "door-telegram"
kind = "door"
machine = "pi"
platform = "telegram"
person = "p1"
token_file = "/etc/imprnt-hub/telegram.token"
schedule = "always"
memory_limit_mb = 192

[[run]]
id = "runner-pi"
kind = "runner"
machine = "pi"
schedule = "always"
# The runner's own. Its agent children run inside its unit, so the unit's cap
# is this plus the children's budget (`child_memory_budget_mb`, 2048 when
# absent), and this number only has to hold the runner process itself.
memory_limit_mb = 512
# The limit the runner enforces on its model child. It is not the runner's own.
child_memory_limit_mb = 2048

# The other machine's runner and hub. A runner is one per machine, started by
# that machine's service manager, reconnecting to the one store forever, and
# claiming the rows of the agents bound to it. The hub beside it is what
# installs and watches that machine's units. Neither is a door.
[[run]]
id = "runner-mac"
kind = "runner"
machine = "mac"
schedule = "always"
memory_limit_mb = 512
child_memory_limit_mb = 2048

[[run]]
id = "hub-mac"
kind = "hub"
machine = "mac"
schedule = "always"
memory_limit_mb = 128

[[run]]
id = "vault-sync"
machine = "pi"
kind = "sync"
repositories = ["p1-vault", "p1-zone", "p2-zone"]
schedule = "every 15m"
memory_limit_mb = 128



# The recognizer's own process, one per machine that runs a door while the
# household's recognizer is one that runs here. The door posts to
# 127.0.0.1:<port>. `residency = "resident"` holds the model between notes,
# which is the default when the line is absent: a voice note arrives exactly
# when the machine is busiest, so memory held predictably beats memory demanded
# at a peak. A machine that cannot afford it says `residency = "idle-unload"`
# and takes the wait on the first note after a quiet spell.
[[run]]
id = "transcriber"
kind = "transcriber"
machine = "pi"
schedule = "always"
memory_limit_mb = 2048
port = 8798
residency = "resident"

# The board: one page per machine that serves one, reached over the tailnet.
# THE ADDRESS BELOW IS AN EXAMPLE. Binding to this machine's own tailnet address
# is what makes the board reachable there and nowhere else, and nothing in the
# loader can check that an address belongs to a tailnet, so it refuses a
# wildcard, an empty value and a name and accepts any other specific address.
# The limit is chosen and unmeasured: the hub's first tick with the board up
# records the real peak, which is what peak-missing exists for.
[[run]]
id = "board"
kind = "board"
machine = "pi"
schedule = "always"
memory_limit_mb = 128
bind = "100.64.0.1"
port = 8794
# A person's artifacts are served on a SECOND port, which is a second origin. An
# agent writes what is served there, and a page it wrote, opened from a chat
# link on the port the acts are on, would be the board's own origin: its script
# could read every page and its form could press every button. Leave this out
# and no artifact is served at all.
artifacts_port = 8795

[[run]]
id = "hub-pi"
kind = "hub"
machine = "pi"
schedule = "always"
memory_limit_mb = 128

[[repositories]]
id = "p1-vault"
person = "p1"
path = "/var/lib/imprnt-hub/p1/vault-project"
remote = "origin"
branch = "main"
required = true

# One checkout of the shared zone per person, inside that person's own vault at
# the path the mount implies. `zone = true` is what the loader checks that path
# and that remote against.
[[repositories]]
id = "p1-zone"
person = "p1"
path = "/var/lib/imprnt-hub/p1/vault-project/vault/shared-notes"
remote = "origin"
branch = "main"
required = true
zone = true

[[repositories]]
id = "p2-zone"
person = "p2"
path = "/var/lib/imprnt-hub/p2/vault-project/vault/shared-notes"
remote = "origin"
branch = "main"
required = true
zone = true

[install]
admin_argv = ["sudo", "-n", "-u", "postgres", "psql"]
