# Stable release — the deliberate cutoff. Click "Run workflow" (or the imprnt-release skill fires it),
# a human approves the gate, and the AFFECTED-since-last-release packages publish to `latest`.
#
# Each affected package is bumped one patch from its current npm `latest` (independent versions — a
# frozen plugin is never bumped). Publishing is OIDC + provenance via the shared _publish.yml. The
# `approve` job sits in the protected `npm-production` environment, so even an agent-triggered release
# pauses for your manual approval before anything touches `latest`. A moving `last-release` tag marks
# the baseline the next release diffs against.
name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan only — compute versions, publish nothing"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan release (affected since last-release)
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.matrix.outputs.any }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      base: ${{ steps.base.outputs.base }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Resolve baseline (last-release tag, else root commit for the first release)
        id: base
        run: |
          if git rev-parse -q --verify refs/tags/last-release >/dev/null; then
            BASE="$(git rev-parse last-release)"
          else
            BASE="$(git rev-list --max-parents=0 HEAD | tail -1)"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
      - name: Compute release matrix
        id: matrix
        env:
          TURBO_SCM_BASE: ${{ steps.base.outputs.base }}
          TURBO_SCM_HEAD: ${{ github.sha }}
        run: bunx turbo ls --affected --output=json | node .github/scripts/release-matrix.mjs

  approve:
    name: Approve production release
    needs: plan
    if: needs.plan.outputs.any == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    environment: npm-production # required reviewer — GitHub pauses here for manual approval
    steps:
      - run: |
          echo "Releasing to latest:"
          echo '${{ needs.plan.outputs.matrix }}'

  publish:
    name: Publish ${{ matrix.name }}@latest
    needs: approve
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/_publish.yml
    with:
      package: ${{ matrix.package }}
      version: ${{ matrix.version }}
      tag: latest

  finalize:
    name: Tag + GitHub Release
    needs: [plan, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - name: Tag each released package + move last-release baseline
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "$MATRIX" | node -e '
            const fs=require("fs");
            const m=JSON.parse(fs.readFileSync(0,"utf8"));
            for (const it of m.include) console.log(`${it.name}-v${it.version}`);
          ' > /tmp/tags.txt
          while read -r tag; do
            [ -n "$tag" ] && git tag -a "$tag" -m "$tag" && echo "tagged $tag"
          done < /tmp/tags.txt
          git tag -f last-release
          git push origin --tags --force
      - name: Create GitHub Release (minimal auto notes — no prose by default)
        env:
          GH_TOKEN: ${{ github.token }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
          BASE: ${{ needs.plan.outputs.base }}
        run: |
          BUMPS="$(echo "$MATRIX" | node -e 'const fs=require("fs");for(const it of JSON.parse(fs.readFileSync(0,"utf8")).include)console.log(`- \`${it.name}\` → ${it.version}`)')"
          COMMITS="$(git log "$BASE"..HEAD --pretty='- %s' --no-merges | head -50)"
          TAG="release-$(date -u +%Y%m%d-%H%M%S)"
          BODY="$(printf '## Packages\n%s\n\n## Changes\n%s\n' "$BUMPS" "$COMMITS")"
          gh release create "$TAG" --title "imprnt release $TAG" --notes "$BODY" --target "$GITHUB_SHA"
