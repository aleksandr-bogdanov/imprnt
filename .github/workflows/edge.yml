# Edge channel — every push to master publishes the AFFECTED packages to the `edge` dist-tag.
#
# Philosophy (matches whenful's beta auto-deploy): push to master whenever; edge ships for dogfooding
# even if it might be rough. The build must pass to publish (no broken bundle ships), but tests are
# reported, not gating — that's what `edge` means. Stable (`latest`) is the deliberate, gated step in
# release.yml. Only packages whose files actually changed get a new edge version (Turbo --affected),
# so a frozen plugin is never needlessly republished.
name: Edge

on:
  push:
    branches: [master]

# Serialize edge runs; never interrupt a publish midway. run_number keeps versions unique regardless.
concurrency:
  group: edge
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # forwarded to the reusable publish job (OIDC + provenance)

jobs:
  detect:
    name: Detect affected + compute edge versions
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.matrix.outputs.any }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0 # full history so Turbo can diff against the push's base commit
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Resolve diff base (handle new-branch all-zero before SHA)
        id: base
        run: |
          BEFORE='${{ github.event.before }}'
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BEFORE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "base=$BEFORE" >> "$GITHUB_OUTPUT"
      - name: Compute edge matrix
        id: matrix
        env:
          TURBO_SCM_BASE: ${{ steps.base.outputs.base }}
          TURBO_SCM_HEAD: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: bunx turbo ls --affected --output=json | node .github/scripts/edge-matrix.mjs

  publish:
    name: Publish ${{ matrix.name }}@edge
    needs: detect
    if: needs.detect.outputs.any == 'true'
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    uses: ./.github/workflows/_publish.yml
    with:
      package: ${{ matrix.package }}
      version: ${{ matrix.version }}
      tag: edge

  # Tests run for visibility but DO NOT gate the edge publish (edge may be rough by design). A red test
  # here is a signal to fix forward, not a blocked release. Build correctness is already enforced by the
  # publish job (a failing build aborts that package's publish).
  test:
    name: Tests (non-blocking)
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bunx turbo run typecheck test
