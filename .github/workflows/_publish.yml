# Reusable publish job — the actual `npm publish`, called by publish.yml for both edge and stable.
#
# IMPORTANT: npm Trusted Publishing validates the ENTRY-POINT (caller) workflow, NOT this reusable
# file. So the trusted publisher on each package must point at `publish.yml` (the single entry), and
# everything funnels through it. This file just does the work.
#
# It authenticates to npm via OIDC (no tokens) and ships provenance attestations (public repo
# required). It builds the one package via Turbo and publishes with --ignore-scripts, so it never runs
# the package's test/prepublish lifecycle — the CALLER decides test-gating (edge: non-blocking;
# release: gated before this is called). Version is set transiently and never committed.
name: _publish

on:
  workflow_call:
    inputs:
      package:
        description: "Directory under packages/ (e.g. imprnt, plugin-guard)"
        required: true
        type: string
      version:
        description: "Exact version to publish (e.g. 0.3.3-edge.418 or 0.4.0)"
        required: true
        type: string
      tag:
        description: "npm dist-tag: edge or latest"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC: Trusted Publishing auth + provenance signing
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10
      # registry-url IS required: it configures the registry so npm attempts OIDC. Do NOT set
      # NODE_AUTH_TOKEN — with no token but an id-token present and a trusted publisher configured,
      # npm authenticates via OIDC. (Removing registry-url makes npm skip OIDC entirely → ENEEDAUTH.)
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Ensure npm supports Trusted Publishing (>= 11.5)
        run: npm install -g npm@latest && npm --version
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Set version (transient — not committed)
        working-directory: packages/${{ inputs.package }}
        run: npm pkg set version=${{ inputs.version }}
      - name: Build the package
        run: |
          name=$(node -p "require('./packages/${{ inputs.package }}/package.json').name")
          echo "Building $name"
          bunx turbo run build --filter="$name"
      - name: Stage core docs (core only ships root CLAUDE.md/README/LICENSE)
        if: ${{ inputs.package == 'imprnt' }}
        working-directory: packages/imprnt
        run: bun run shipdocs
      - name: Publish to npm (OIDC, provenance, dist-tag)
        working-directory: packages/${{ inputs.package }}
        run: npm publish --tag ${{ inputs.tag }} --access public --provenance --ignore-scripts
