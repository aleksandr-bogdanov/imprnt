# PR checks — typecheck, test, build (Turbo-cached), plus a non-blocking dependency audit.
# No publishing here; this only gates merges into master. Edge/latest publishing live in edge.yml
# and release.yml.
name: CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: typecheck + test + build (Turbo)
        run: bunx turbo run typecheck test build
      - name: dependency audit (non-blocking)
        continue-on-error: true
        run: bun audit
