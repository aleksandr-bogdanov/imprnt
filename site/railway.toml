# Railway config as code.
#
# This file lives at the service's root directory. When connecting the GitHub
# repo in Railway, set the service Root Directory to `site` so Railway reads this
# file and the sibling Dockerfile. After that, every push to master builds and
# deploys automatically. The same config is used by `railway up` from this dir.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Caddy serves the static build and answers "/" with 200.
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
